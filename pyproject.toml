[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-local-sync"
version = "0.1.0b1"
description = "Conservative offline local Codex organization sync for Windows"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Desan Vasu"}]
readme = "README.md"
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.scripts]
codex-local-sync = "codex_local_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
