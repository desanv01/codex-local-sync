name: Bug report
description: Report a problem using sanitized diagnostics and synthetic data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not upload settings, journals, logs, backups, databases, transcripts, real profile IDs or personal paths. Use synthetic examples. For vulnerabilities, read SECURITY.md first.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Helper, Python, Windows and Codex desktop versions.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include command name and sanitized error category. Review all output before sharing.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Steps and generated example data; no real settings or identifiers.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this report and attachments and removed private data.
          required: true
