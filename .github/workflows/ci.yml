name: Focused checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      # https://github.com/actions/checkout/releases/tag/v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # https://github.com/actions/setup-python/releases/tag/v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tooling
        run: python -m pip install build==1.2.2.post1
      - name: Build distributions
        run: python -m build
      - name: Audit wheel and sdist
        run: python tests/audit_packages.py dist
      - name: Install wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -LiteralPath dist -Filter '*.whl' | Select-Object -First 1
          python -m pip install --no-deps $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Focused synthetic tests
        run: python -m unittest discover -s tests -t . -v
      - name: Package entry points
        run: |
          python -m codex_local_sync --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          codex-local-sync --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and audit clean source archive
        run: python scripts/build_release.py
